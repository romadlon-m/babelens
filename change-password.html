<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Babelens - Ubah Kata Sandi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js?v=20260913"></script>
  <link rel="stylesheet" href="style.css?v=20260913f">
</head>
<body class="login-body">

  <div class="login-card">
    <div style="display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:28px;">
      <img src="assets/images/babelens-logo.png" alt="Babelens" style="height:52px;">
      <div style="font-size:13px;color:var(--muted);line-height:1.4;font-weight:500;">Lensa Berita<br>Bangka Belitung</div>
    </div>

    <h2 style="margin:0 0 4px;font-size:18px;font-weight:600;color:var(--text);">Buat Kata Sandi Baru</h2>
    <p style="color:var(--muted);font-size:14px;margin:0 0 24px;">Anda wajib mengganti kata sandi sebelum dapat menggunakan aplikasi.</p>

    <div id="change-error" class="login-error" style="display:none;"></div>

    <div class="filter-group">
      <label>Kata Sandi Baru</label>
      <input type="password" id="new-password" placeholder="Minimal 8 karakter" autocomplete="new-password">
    </div>
    <div class="filter-group">
      <label>Konfirmasi Kata Sandi Baru</label>
      <input type="password" id="confirm-password" placeholder="Ulangi kata sandi baru" autocomplete="new-password">
    </div>

    <button class="primary-btn" id="changeBtn" style="width:100%;margin-top:8px;" onclick="handleChangePassword()">
      Simpan Kata Sandi
    </button>
    <p style="text-align:center;margin-top:12px;font-size:13px;">
      <a href="javascript:history.back()" style="color:var(--muted);">Batal</a>
    </p>
  </div>

  <script src="change-password.js?v=20260906"></script>
</body>
</html>
