<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Babelens - Kelola Pengguna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js?v=20260913"></script>
  <link rel="stylesheet" href="style.css?v=20260913d">
</head>
<body class="admin-page" style="visibility:hidden;">

  <!-- GLOBAL HEADER -->
  <header class="app-header">
    <div class="app-header-left">
      <img src="assets/images/babelens-logo.png" alt="Babelens" class="app-header-logo">
      <div class="app-header-tagline"><span>Lensa Berita</span><span>Bangka Belitung</span></div>
    </div>
    <div id="nav-placeholder" class="app-header-nav"></div>
    <div id="header-user-widget"></div>
  </header>

  <div class="app-body">

    <!-- MAIN -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-row">
          <div class="topbar-left">
            <div><h2>Kelola Pengguna</h2></div>
          </div>
          <button class="primary-btn" onclick="openAdminModal()">+ Tambah Pengguna</button>
        </div>
      </header>

      <div class="admin-tabs">
        <button class="admin-tab-btn active" id="tab-btn-recent" onclick="switchAdminTab('recent')">Sudah Pernah Login</button>
        <button class="admin-tab-btn" id="tab-btn-all" onclick="switchAdminTab('all')">Seluruh Pegawai</button>
        <button class="admin-tab-btn" id="tab-btn-labeling" onclick="switchAdminTab('labeling')">Aktivitas Labeling</button>
        <button class="admin-tab-btn" id="tab-btn-detail" onclick="switchAdminTab('detail')">Detail Baris</button>
      </div>

      <div id="admin-users-view" class="admin-table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th>NIP</th>
              <th>Nama</th>
              <th>Email Google</th>
              <th>Status</th>
              <th>Login Terakhir</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="admin-users-tbody">
            <tr><td colspan="6">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Monitoring produktivitas intern labeling (LABELING_TOOL_PLAN.md bagian 7):
           hitungan submit per intern/jenis/hari dari tabel labeling_log. -->
      <div id="admin-labeling-view" class="admin-table-wrapper" hidden>
        <table class="admin-table">
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Nama</th>
              <th>Jenis</th>
              <th>Jumlah Submit</th>
            </tr>
          </thead>
          <tbody id="admin-labeling-tbody">
            <tr><td colspan="4">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Per-baris detail (drill-down dari Aktivitas Labeling di atas, atau dilihat
           bebas): status label per baris `news`, filter jenis/status, dan filter
           intern tertentu saat masuk lewat klik nama di tab Aktivitas Labeling. -->
      <div id="admin-detail-view" class="admin-table-wrapper" hidden>
        <div class="admin-detail-filters">
          <div class="filter-group">
            <label for="detail-jenis">Jenis</label>
            <select id="detail-jenis" onchange="onDetailFilterChange()">
              <option value="screener">Screener</option>
              <option value="lapus">Lapangan Usaha</option>
              <option value="pengeluaran">Pengeluaran</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="detail-status">Status</label>
            <select id="detail-status" onchange="onDetailFilterChange()">
              <option value="semua">Semua</option>
              <option value="belum">Belum dilabel</option>
              <option value="sudah">Sudah dilabel</option>
              <option value="perlu_relabel">Perlu direlabel (prompt lama)</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="detail-labeler-select">Intern</label>
            <select id="detail-labeler-select" onchange="onDetailFilterChange()">
              <option value="">Semua Intern</option>
            </select>
          </div>
        </div>

        <table class="admin-table">
          <thead>
            <tr>
              <th>No</th>
              <th>Tanggal</th>
              <th>Judul</th>
              <th>Sumber</th>
              <th>Label</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="admin-detail-tbody">
            <tr><td colspan="6">Memuat data...</td></tr>
          </tbody>
        </table>

        <div class="admin-detail-pagination">
          <button class="card-btn" id="detail-prev-btn" onclick="changeDetailPage(-1)">‹ Sebelumnya</button>
          <span id="detail-page-info"></span>
          <button class="card-btn" id="detail-next-btn" onclick="changeDetailPage(1)">Berikutnya ›</button>
        </div>
      </div>
    </main>

  </div><!-- /.app-body -->

  <!-- ADD USER MODAL -->
  <div id="admin-modal-overlay" onclick="closeAdminModal(event)">
    <div class="feedback-modal">
      <div class="feedback-modal-header">
        <span>Tambah Pengguna</span>
        <button onclick="closeAdminModal(null, true)">✕</button>
      </div>
      <div class="admin-modal-field">
        <label for="admin-new-nip">NIP (9 digit)</label>
        <input type="text" id="admin-new-nip" maxlength="9" inputmode="numeric" placeholder="3400xxxxx">
      </div>
      <div class="admin-modal-field">
        <label for="admin-new-nama">Nama</label>
        <input type="text" id="admin-new-nama" placeholder="Nama lengkap">
      </div>
      <button id="admin-modal-submit" class="primary-btn" onclick="submitNewUser()">Simpan</button>
      <div id="admin-status"></div>
    </div>
  </div>

  <script src="sidebar.js?v=20260913"></script>
  <script src="admin-users.js?v=20260913d"></script>
  <script>
    requireAuth().then(r => {
      if (!r) return;
      if (!r.profile?.is_admin) {
        window.location.replace('index.html');
        return;
      }
      document.body.style.visibility = 'visible';
      loadAdminUsers();
    });
  </script>
</body>
</html>
