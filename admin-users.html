<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Babelens - Kelola Pengguna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js?v=20260913"></script>
  <link rel="stylesheet" href="style.css?v=20260914d">
</head>
<body class="admin-page" style="visibility:hidden;">

  <!-- GLOBAL HEADER -->
  <header class="app-header">
    <div class="app-header-left">
      <img src="assets/images/babelens-logo.png" alt="Babelens" class="app-header-logo">
      <div class="app-header-tagline"><span>Lensa Berita</span><span>Bangka Belitung</span></div>
    </div>
    <div id="nav-placeholder" class="app-header-nav"></div>
    <div id="header-user-widget"></div>
  </header>

  <div class="app-body">

    <!-- MAIN -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-row">
          <div class="topbar-left">
            <div><h2>Kelola Pengguna</h2></div>
          </div>
          <button class="primary-btn" onclick="openAdminModal()">+ Tambah Pengguna</button>
        </div>
      </header>

      <div class="admin-tabs">
        <button class="admin-tab-btn active" id="tab-btn-recent" onclick="switchAdminTab('recent')">Sudah Pernah Login</button>
        <button class="admin-tab-btn" id="tab-btn-all" onclick="switchAdminTab('all')">Seluruh Pegawai</button>
        <button class="admin-tab-btn" id="tab-btn-labeling" onclick="switchAdminTab('labeling')">Aktivitas Labeling</button>
        <button class="admin-tab-btn" id="tab-btn-detail" onclick="switchAdminTab('detail')">Detail Baris</button>
      </div>

      <div id="admin-users-filters" class="admin-detail-filters">
        <div class="filter-group">
          <label for="admin-search">Cari</label>
          <input type="text" id="admin-search" placeholder="Nama atau NIP..." oninput="onAdminFilterChange()">
        </div>
        <div class="filter-group">
          <label for="admin-filter-role">Peran</label>
          <select id="admin-filter-role" onchange="onAdminFilterChange()">
            <option value="semua">Semua</option>
            <option value="admin">Admin</option>
            <option value="labeler">Labeler</option>
            <option value="biasa">Pegawai Biasa</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="admin-filter-status">Status</label>
          <select id="admin-filter-status" onchange="onAdminFilterChange()">
            <option value="semua">Semua</option>
            <option value="aktif">Aktif</option>
            <option value="nonaktif">Nonaktif</option>
            <option value="belum_ganti_password">Belum ganti password</option>
          </select>
        </div>
      </div>

      <div id="admin-users-view" class="admin-table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th data-sort="nip">NIP</th>
              <th data-sort="nama">Nama</th>
              <th data-sort="email">Email Google</th>
              <th data-sort="status">Status</th>
              <th data-sort="login">Login Terakhir</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="admin-users-tbody">
            <tr><td colspan="6">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Monitoring produktivitas intern labeling (LABELING_TOOL_PLAN.md bagian 7):
           hitungan submit per intern/jenis/hari dari tabel labeling_log. -->
      <div id="admin-labeling-view" class="admin-table-wrapper" hidden>
        <table class="admin-table">
          <thead>
            <tr>
              <th data-sort="date">Tanggal</th>
              <th data-sort="nama">Nama</th>
              <th data-sort="jenis">Jenis</th>
              <th data-sort="count">Jumlah Submit</th>
            </tr>
          </thead>
          <tbody id="admin-labeling-tbody">
            <tr><td colspan="4">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Per-baris detail (drill-down dari Aktivitas Labeling di atas, atau dilihat
           bebas): status label per baris `news`, filter jenis/status/label/sumber/
           tanggal, dan filter labeler tertentu saat masuk lewat klik nama di tab
           Aktivitas Labeling. -->
      <div id="admin-detail-view" hidden>
        <div class="admin-detail-filters">
          <div class="filter-group">
            <label for="detail-jenis">Jenis</label>
            <select id="detail-jenis" onchange="onDetailFilterChange()">
              <option value="screener">Pengecekan Awal</option>
              <option value="lapus">Lapangan Usaha</option>
              <option value="pengeluaran">Pengeluaran</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="detail-status">Status</label>
            <select id="detail-status" onchange="onDetailFilterChange()">
              <option value="semua">Semua</option>
              <option value="belum">Belum dilabel</option>
              <option value="sudah">Sudah dilabel</option>
              <option value="perlu_relabel">Perlu direlabel (prompt lama)</option>
              <option value="ditandai">Ditandai bermasalah</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="detail-label-filter">Label</label>
            <select id="detail-label-filter" onchange="onDetailFilterChange()">
              <option value="">Semua</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="detail-source">Sumber</label>
            <input type="text" id="detail-source" placeholder="mis. RRI Sungailiat" oninput="onDetailSourceInput()">
          </div>
          <div class="filter-group">
            <label for="detail-date-from">Dari Tanggal</label>
            <input type="date" id="detail-date-from" onchange="onDetailFilterChange()">
          </div>
          <div class="filter-group">
            <label for="detail-date-to">Sampai Tanggal</label>
            <input type="date" id="detail-date-to" onchange="onDetailFilterChange()">
          </div>
          <div class="filter-group">
            <label for="detail-labeler-select">Labeler</label>
            <select id="detail-labeler-select" onchange="onDetailFilterChange()">
              <option value="">Semua Labeler</option>
            </select>
          </div>
        </div>

        <div class="admin-table-wrapper">
          <table class="admin-table">
            <thead>
              <tr>
                <th data-sort="no">No</th>
                <th data-sort="tanggal">Tanggal</th>
                <th data-sort="judul">Judul</th>
                <th data-sort="sumber">Sumber</th>
                <th data-sort="label">Label</th>
                <th data-sort="labeler">Dikerjakan Oleh</th>
                <th data-sort="status">Status</th>
              </tr>
            </thead>
            <tbody id="admin-detail-tbody">
              <tr><td colspan="7">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="admin-detail-pagination">
          <button class="card-btn" id="detail-prev-btn" onclick="changeDetailPage(-1)">‹ Sebelumnya</button>
          <span id="detail-page-info"></span>
          <button class="card-btn" id="detail-next-btn" onclick="changeDetailPage(1)">Berikutnya ›</button>
        </div>
      </div>
    </main>

  </div><!-- /.app-body -->

  <!-- ADD USER MODAL -->
  <div id="admin-modal-overlay" onclick="closeAdminModal(event)">
    <div class="feedback-modal">
      <div class="feedback-modal-header">
        <span>Tambah Pengguna</span>
        <button onclick="closeAdminModal(null, true)">✕</button>
      </div>
      <div class="admin-modal-field">
        <label for="admin-new-nip">NIP (9 digit)</label>
        <input type="text" id="admin-new-nip" maxlength="9" inputmode="numeric" placeholder="3400xxxxx">
      </div>
      <div class="admin-modal-field">
        <label for="admin-new-nama">Nama</label>
        <input type="text" id="admin-new-nama" placeholder="Nama lengkap">
      </div>
      <div class="admin-modal-checkbox">
        <label><input type="checkbox" id="admin-new-is-labeler"> Bisa akses Labeling PDRB (labeler)</label>
      </div>
      <button id="admin-modal-submit" class="primary-btn" onclick="submitNewUser()">Simpan</button>
      <div id="admin-status"></div>
    </div>
  </div>

  <!-- EDIT USER MODAL -->
  <div id="admin-edit-modal-overlay" onclick="closeEditModal(event)">
    <div class="feedback-modal">
      <div class="feedback-modal-header">
        <span>Edit Pengguna</span>
        <button onclick="closeEditModal(null, true)">✕</button>
      </div>
      <input type="hidden" id="edit-user-id">
      <div class="admin-modal-field">
        <label for="edit-nip">NIP (9 digit)</label>
        <input type="text" id="edit-nip" maxlength="9" inputmode="numeric" placeholder="3400xxxxx">
      </div>
      <div class="admin-modal-field">
        <label for="edit-nama">Nama</label>
        <input type="text" id="edit-nama" placeholder="Nama lengkap">
      </div>
      <div class="admin-modal-checkbox">
        <label><input type="checkbox" id="edit-is-labeler"> Bisa akses Labeling PDRB (labeler)</label>
      </div>
      <button id="edit-modal-submit" class="primary-btn" onclick="submitEditUser()">Simpan</button>
      <div id="edit-status"></div>
    </div>
  </div>

  <script src="sidebar.js?v=20260913f"></script>
  <script src="admin-users.js?v=20260914d"></script>
  <script>
    requireAuth().then(r => {
      if (!r) return;
      if (!r.profile?.is_admin) {
        window.location.replace('index.html');
        return;
      }
      document.body.style.visibility = 'visible';
      loadAdminUsers();
    });
  </script>
</body>
</html>
