<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Babelens - Pengaturan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js?v=20260919"></script>
  <link rel="stylesheet" href="style.css?v=20260924d">
  <style>
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
      align-items: start;
    }
    .settings-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 22px;
    }
    .settings-card h3 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 15px;
      font-weight: 700;
      color: #111827;
    }
    .settings-value { font-size: 14px; color: var(--text); word-break: break-word; }
    .settings-note { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0 0 14px; }
    .settings-actions { display: flex; flex-direction: column; gap: 10px; }
    .settings-actions button { width: 100%; }
    .settings-btn-danger {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      background: #fef2f2;
      color: #dc2626;
      transition: 0.2s;
    }
    .settings-btn-danger:hover { background: #fee2e2; }
    .settings-btn-danger:disabled, .settings-actions button:disabled { opacity: 0.6; cursor: default; }
    .settings-success {
      background: #ecfdf5;
      border-color: #10b981;
      color: #065f46;
    }
    .settings-banner {
      display: none;
      position: relative;
      background: #ecfdf5;
      border: 1px solid #10b981;
      color: #065f46;
      border-radius: 10px;
      padding: 12px 40px 12px 16px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .settings-banner-close { position: absolute; top: 8px; right: 12px; cursor: pointer; font-weight: 600; }
    .pw-field { position: relative; }
    .pw-field input { padding-right: 40px; }
    .pw-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      padding: 4px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
    }
    .pw-cancel {
      display: block;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: 12px;
      text-decoration: none;
    }
  </style>
</head>
<body style="visibility:hidden">

  <!-- GLOBAL HEADER -->
  <header class="app-header">
    <div class="app-header-left">
      <img src="assets/images/babelens-logo.png" alt="Babelens" class="app-header-logo">
      <div class="app-header-tagline"><span>Lensa Berita</span><span>Bangka Belitung</span></div>
    </div>
    <div id="nav-placeholder" class="app-header-nav"></div>
    <div id="header-user-widget"></div>
  </header>

  <div class="app-body">
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <div><h2>Pengaturan</h2></div>
        </div>
      </header>

      <div id="setup-banner" class="settings-banner">
        <span id="setup-banner-text"></span>
        <span class="settings-banner-close" onclick="document.getElementById('setup-banner').style.display='none';">&times;</span>
      </div>

      <div class="settings-grid">

        <!-- INFORMASI AKUN -->
        <section class="settings-card">
          <h3>👤 Informasi Akun</h3>
          <div class="filter-group">
            <label>Nama</label>
            <div id="user-nama" class="settings-value"></div>
          </div>
          <div class="filter-group" style="margin-bottom:0;">
            <label>NIP Lama</label>
            <div id="user-nip" class="settings-value"></div>
          </div>
        </section>

        <!-- AKUN GOOGLE -->
        <section class="settings-card">
          <h3>🔗 Akun Google</h3>
          <div id="google-error" class="login-error" style="display:none;"></div>
          <div id="google-success" class="login-error settings-success" style="display:none;"></div>

          <div id="google-unlinked" style="display:none;">
            <p class="settings-note">Hubungkan akun Google agar Anda bisa masuk tanpa mengetik NIP dan kata sandi.</p>
            <div class="settings-actions">
              <button class="primary-btn" id="linkGoogleBtn" onclick="handleLinkGoogle()">Hubungkan Akun Google</button>
            </div>
          </div>

          <div id="google-linked" style="display:none;">
            <div class="filter-group">
              <label>Akun Google terhubung</label>
              <div id="google-email" class="settings-value"></div>
            </div>
            <p class="settings-note">Setelah tautan dihapus, Anda tetap bisa masuk dengan NIP dan kata sandi.</p>
            <div class="settings-actions">
              <button class="secondary-btn" id="changeGoogleBtn" onclick="handleChangeGoogle()">Ganti Akun Google</button>
              <button class="settings-btn-danger" id="unlinkGoogleBtn" onclick="handleUnlinkGoogle()">Hapus Tautan Akun Google</button>
            </div>
          </div>
        </section>

        <!-- KATA SANDI -->
        <section class="settings-card">
          <h3>🔒 Ubah Kata Sandi</h3>
          <div id="password-error" class="login-error" style="display:none;"></div>
          <div id="password-success" class="login-error settings-success" style="display:none;"></div>

          <div class="settings-actions" id="togglePasswordFormWrap">
            <button class="primary-btn" id="togglePasswordFormBtn" onclick="togglePasswordForm(true)">Ubah Kata Sandi</button>
          </div>

          <div id="password-form" style="display:none;">
            <div class="filter-group">
              <label>Kata Sandi Saat Ini</label>
              <div class="pw-field">
                <input type="password" id="current-password" placeholder="Kata sandi saat ini" autocomplete="current-password">
                <button type="button" class="pw-toggle" aria-label="Tampilkan atau sembunyikan kata sandi" onclick="togglePasswordVisibility('current-password')">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
              </div>
            </div>
            <div class="filter-group">
              <label>Kata Sandi Baru</label>
              <div class="pw-field">
                <input type="password" id="new-password" placeholder="Minimal 8 karakter" autocomplete="new-password">
                <button type="button" class="pw-toggle" aria-label="Tampilkan atau sembunyikan kata sandi" onclick="togglePasswordVisibility('new-password')">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
              </div>
            </div>
            <div class="filter-group">
              <label>Konfirmasi Kata Sandi Baru</label>
              <div class="pw-field">
                <input type="password" id="confirm-password" placeholder="Ulangi kata sandi baru" autocomplete="new-password">
                <button type="button" class="pw-toggle" aria-label="Tampilkan atau sembunyikan kata sandi" onclick="togglePasswordVisibility('confirm-password')">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
              </div>
            </div>

            <div class="settings-actions">
              <button class="primary-btn" id="changePasswordBtn" onclick="handleChangePassword()">Simpan Kata Sandi</button>
            </div>
            <a href="#" class="pw-cancel" onclick="togglePasswordForm(false);return false;">Batal</a>
          </div>
        </section>

      </div>
    </main>
  </div>

  <script src="dialog.js?v=20260924"></script>
  <script src="sidebar.js?v=20260919"></script>
  <script>
    let currentSession = null;
    let currentGoogleIdentity = null;

    const $ = id => document.getElementById(id);

    function showGoogleMessage(kind, text) {
      $('google-error').style.display = 'none';
      $('google-success').style.display = 'none';
      if (!text) return;
      const el = kind === 'error' ? $('google-error') : $('google-success');
      el.textContent = text;
      el.style.display = 'block';
    }

    async function refreshGoogleState() {
      const { data, error } = await window.db.auth.getUserIdentities();
      currentGoogleIdentity = (!error && data?.identities?.find(i => i.provider === 'google')) || null;

      if (currentGoogleIdentity) {
        $('google-email').textContent = currentGoogleIdentity.identity_data?.email || '-';
        $('google-linked').style.display = 'block';
        $('google-unlinked').style.display = 'none';
      } else {
        $('google-linked').style.display = 'none';
        $('google-unlinked').style.display = 'block';
      }
    }

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;
      document.body.style.visibility = 'visible';
      currentSession = auth.session;

      $('user-nama').textContent = auth.profile?.nama || '-';
      $('user-nip').textContent = auth.profile?.nip_lama || '-';

      if (sessionStorage.getItem('setup_success') === 'true') {
        sessionStorage.removeItem('setup_success');
        $('setup-banner-text').textContent = 'Kata sandi berhasil diubah. Hubungkan akun Google Anda untuk kemudahan login berikutnya.';
        $('setup-banner').style.display = 'block';
      }

      await refreshGoogleState();

      const googleLinkError = sessionStorage.getItem('google_link_error');
      if (googleLinkError) {
        sessionStorage.removeItem('google_link_error');
        showGoogleMessage('error', googleLinkError === 'already_linked'
          ? 'Akun Google ini sudah terhubung ke pengguna lain. Hubungi admin jika ini keliru.'
          : 'Gagal menghubungkan akun Google. Silakan coba lagi.');
      }
    })();

    async function startLinkGoogle() {
      const { error: refreshError } = await window.db.auth.refreshSession();
      if (refreshError) {
        showGoogleMessage('error', 'Sesi tidak valid. Silakan login ulang.');
        return false;
      }

      sessionStorage.setItem('oauth_intent', 'link');
      sessionStorage.setItem('oauth_return', 'settings.html');
      const { error } = await window.db.auth.linkIdentity({
        provider: 'google',
        options: {
          redirectTo: window.location.href.split('/').slice(0, -1).join('/') + '/google-callback.html',
          flowType: 'pkce',
          queryParams: { prompt: 'select_account' }
        }
      });

      if (error) {
        console.error(error);
        showGoogleMessage('error', 'Akun Google ini sudah terhubung ke pengguna lain. Hubungi admin jika ini keliru.');
        return false;
      }
      return true;
    }

    function setGoogleButtonsDisabled(disabled) {
      ['linkGoogleBtn', 'changeGoogleBtn', 'unlinkGoogleBtn'].forEach(id => { $(id).disabled = disabled; });
    }

    async function handleLinkGoogle() {
      showGoogleMessage(null);
      setGoogleButtonsDisabled(true);
      const ok = await startLinkGoogle();
      if (!ok) setGoogleButtonsDisabled(false);
    }

    async function unlinkCurrentGoogle() {
      const { error } = await window.db.auth.unlinkIdentity(currentGoogleIdentity);
      if (error) {
        console.error(error);
        showGoogleMessage('error', 'Gagal menghapus tautan akun Google. Silakan coba lagi.');
        return false;
      }
      return true;
    }

    async function handleUnlinkGoogle() {
      if (!currentGoogleIdentity) return;
      const confirmed = await showConfirm('Anda tetap bisa masuk dengan NIP dan kata sandi.', {
        title: 'Hapus tautan akun Google?',
        confirmText: 'Hapus Tautan',
        danger: true
      });
      if (!confirmed) return;

      showGoogleMessage(null);
      setGoogleButtonsDisabled(true);
      const ok = await unlinkCurrentGoogle();
      await refreshGoogleState();
      setGoogleButtonsDisabled(false);
      if (ok) showGoogleMessage('success', 'Tautan akun Google berhasil dihapus.');
    }

    async function handleChangeGoogle() {
      if (!currentGoogleIdentity) return;
      const confirmed = await showConfirm('Tautan akun Google saat ini akan dihapus, lalu Anda diminta memilih akun Google lain.', {
        title: 'Ganti akun Google?',
        confirmText: 'Lanjutkan'
      });
      if (!confirmed) return;

      showGoogleMessage(null);
      setGoogleButtonsDisabled(true);
      const unlinked = await unlinkCurrentGoogle();
      if (!unlinked) {
        setGoogleButtonsDisabled(false);
        return;
      }

      const linking = await startLinkGoogle();
      if (!linking) {
        await refreshGoogleState();
        setGoogleButtonsDisabled(false);
      }
    }

    function togglePasswordForm(show) {
      $('password-form').style.display = show ? 'block' : 'none';
      $('togglePasswordFormWrap').style.display = show ? 'none' : 'flex';
      if (!show) {
        $('current-password').value = '';
        $('new-password').value = '';
        $('confirm-password').value = '';
        $('password-error').style.display = 'none';
        $('password-success').style.display = 'none';
      }
    }

    function togglePasswordVisibility(inputId) {
      const input = $(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    async function handleChangePassword() {
      const currentPass = $('current-password').value;
      const newPass = $('new-password').value;
      const confirmPass = $('confirm-password').value;
      const btn = $('changePasswordBtn');
      const errorEl = $('password-error');
      const successEl = $('password-success');

      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      const fail = msg => {
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
      };

      if (!currentPass) return fail('Isi kata sandi saat ini terlebih dahulu.');
      if (newPass.length < 8) return fail('Kata sandi baru minimal 8 karakter.');
      if (newPass !== confirmPass) return fail('Konfirmasi kata sandi tidak cocok.');
      if (newPass === currentPass) return fail('Kata sandi baru harus berbeda dari kata sandi saat ini.');

      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      const { error: verifyError } = await window.db.auth.signInWithPassword({
        email: currentSession.user.email,
        password: currentPass
      });
      if (verifyError) {
        btn.disabled = false;
        btn.textContent = 'Simpan Kata Sandi';
        return fail('Kata sandi saat ini salah.');
      }

      const { error } = await window.db.auth.updateUser({ password: newPass });

      btn.disabled = false;
      btn.textContent = 'Simpan Kata Sandi';

      if (error) return fail('Gagal mengubah kata sandi. Silakan coba lagi.');

      $('current-password').value = '';
      $('new-password').value = '';
      $('confirm-password').value = '';
      successEl.textContent = 'Kata sandi berhasil diubah.';
      successEl.style.display = 'block';
    }
  </script>
</body>
</html>
