<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Babelens - Pengaturan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js?v=20260906"></script>
  <link rel="stylesheet" href="style.css?v=20260906e">
</head>
<body class="login-body">

  <div class="login-card" style="max-width:480px;">
    <a href="index.html" style="font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:16px;display:block;">← Kembali ke Dashboard</a>
    <div style="display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:28px;">
      <img src="assets/images/babelens-logo.png" alt="Babelens" style="height:52px;">
      <div style="font-size:13px;color:var(--muted);line-height:1.4;font-weight:500;">Lensa Berita<br>Bangka Belitung</div>
    </div>

    <div id="setup-banner" style="display:none;background:#ecfdf5;border:1px solid #10b981;color:#065f46;border-radius:10px;padding:12px 16px;font-size:13px;margin-bottom:20px;position:relative;">
      <span id="setup-banner-text"></span>
      <span onclick="document.getElementById('setup-banner').style.display='none';" style="position:absolute;top:8px;right:12px;cursor:pointer;font-weight:600;">&times;</span>
    </div>

    <h2 style="margin:0 0 16px;font-size:18px;font-weight:600;color:var(--text);">Informasi Akun</h2>
    <div class="filter-group">
      <label>Nama</label>
      <div id="user-nama" style="padding:10px 0;color:var(--text);font-size:14px;"></div>
    </div>
    <div class="filter-group">
      <label>NIP Lama</label>
      <div id="user-nip" style="padding:10px 0;color:var(--text);font-size:14px;"></div>
    </div>

    <h2 style="margin:28px 0 16px;font-size:18px;font-weight:600;color:var(--text);">Akun Google</h2>
    <div id="google-error" class="login-error" style="display:none;"></div>
    <div id="google-linked" style="display:none;font-size:14px;color:var(--text);"></div>
    <button class="primary-btn" id="linkGoogleBtn" style="width:100%;display:none;" onclick="handleLinkGoogle()">
      Hubungkan Akun Google
    </button>

    <h2 style="margin:28px 0 16px;font-size:18px;font-weight:600;color:var(--text);">Ubah Kata Sandi</h2>
    <div id="password-error" class="login-error" style="display:none;"></div>
    <div id="password-success" class="login-error" style="display:none;background:#ecfdf5;border-color:#10b981;color:#065f46;"></div>

    <button class="primary-btn" id="togglePasswordFormBtn" style="width:100%;" onclick="togglePasswordForm(true)">
      Ubah Kata Sandi
    </button>

    <div id="password-form" style="display:none;">
      <div class="filter-group">
        <label>Kata Sandi Saat Ini</label>
        <div style="position:relative;">
          <input type="password" id="current-password" placeholder="Kata sandi saat ini" autocomplete="current-password" style="width:100%;padding-right:40px;box-sizing:border-box;">
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('current-password', this)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;padding:4px;cursor:pointer;display:flex;align-items:center;color:var(--muted);">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
      <div class="filter-group">
        <label>Kata Sandi Baru</label>
        <div style="position:relative;">
          <input type="password" id="new-password" placeholder="Minimal 8 karakter" autocomplete="new-password" style="width:100%;padding-right:40px;box-sizing:border-box;">
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('new-password', this)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;padding:4px;cursor:pointer;display:flex;align-items:center;color:var(--muted);">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
      <div class="filter-group">
        <label>Konfirmasi Kata Sandi Baru</label>
        <div style="position:relative;">
          <input type="password" id="confirm-password" placeholder="Ulangi kata sandi baru" autocomplete="new-password" style="width:100%;padding-right:40px;box-sizing:border-box;">
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('confirm-password', this)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;padding:4px;cursor:pointer;display:flex;align-items:center;color:var(--muted);">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button class="primary-btn" id="changePasswordBtn" style="width:100%;margin-top:8px;" onclick="handleChangePassword()">
        Simpan Kata Sandi
      </button>
      <a href="#" onclick="togglePasswordForm(false);return false;" style="display:block;text-align:center;font-size:13px;color:var(--muted);margin-top:12px;text-decoration:none;">Batal</a>
    </div>
  </div>

  <script>
    let currentSession = null;

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;
      currentSession = auth.session;

      document.getElementById('user-nama').textContent = auth.profile?.nama || '-';
      document.getElementById('user-nip').textContent = auth.profile?.nip_lama || '-';

      const setupSuccess = sessionStorage.getItem('setup_success');
      if (setupSuccess === 'true') {
        sessionStorage.removeItem('setup_success');
        document.getElementById('setup-banner-text').textContent = 'Kata sandi berhasil diubah. Hubungkan akun Google Anda untuk kemudahan login berikutnya.';
        document.getElementById('setup-banner').style.display = 'block';
      }

      const { data: identitiesData, error: identitiesError } = await window.db.auth.getUserIdentities();
      const googleIdentity = !identitiesError && identitiesData?.identities?.find(i => i.provider === 'google');

      if (googleIdentity) {
        const email = googleIdentity.identity_data?.email || '';
        document.getElementById('google-linked').textContent = `Akun Google terhubung: ${email} ✓`;
        document.getElementById('google-linked').style.display = 'block';
      } else {
        document.getElementById('linkGoogleBtn').style.display = 'block';
      }

      const googleLinkError = sessionStorage.getItem('google_link_error');
      if (googleLinkError) {
        sessionStorage.removeItem('google_link_error');
        const errorEl = document.getElementById('google-error');
        errorEl.textContent = googleLinkError === 'already_linked'
          ? 'Akun Google ini sudah terhubung ke pengguna lain. Hubungi admin jika ini keliru.'
          : 'Gagal menghubungkan akun Google. Silakan coba lagi.';
        errorEl.style.display = 'block';
      }
    })();

    async function handleLinkGoogle() {
      const btn = document.getElementById('linkGoogleBtn');
      const errorEl = document.getElementById('google-error');
      errorEl.style.display = 'none';

      btn.disabled = true;
      btn.textContent = 'Memproses...';

      const { error: refreshError } = await window.db.auth.refreshSession();
      if (refreshError) {
        errorEl.textContent = 'Sesi tidak valid. Silakan login ulang.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Hubungkan Akun Google';
        return;
      }

      sessionStorage.setItem('oauth_intent', 'link');
      const { error } = await window.db.auth.linkIdentity({
        provider: 'google',
        options: {
          redirectTo: window.location.href.split('/').slice(0, -1).join('/') + '/google-callback.html',
          flowType: 'pkce'
        }
      });

      if (error) {
        console.error(error);
        errorEl.textContent = 'Akun Google ini sudah terhubung ke pengguna lain. Hubungi admin jika ini keliru.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Hubungkan Akun Google';
      }
    }

    function togglePasswordForm(show) {
      document.getElementById('password-form').style.display = show ? 'block' : 'none';
      document.getElementById('togglePasswordFormBtn').style.display = show ? 'none' : 'block';
      if (!show) {
        document.getElementById('current-password').value = '';
        document.getElementById('new-password').value = '';
        document.getElementById('confirm-password').value = '';
        document.getElementById('password-error').style.display = 'none';
        document.getElementById('password-success').style.display = 'none';
      }
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    async function handleChangePassword() {
      const newPass = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;
      const btn = document.getElementById('changePasswordBtn');
      const errorEl = document.getElementById('password-error');
      const successEl = document.getElementById('password-success');

      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      if (newPass.length < 8) {
        errorEl.textContent = 'Gagal mengubah kata sandi. Pastikan kata sandi baru minimal 8 karakter.';
        errorEl.style.display = 'block';
        return;
      }
      if (newPass !== confirm) {
        errorEl.textContent = 'Konfirmasi kata sandi tidak cocok.';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      const { error } = await window.db.auth.updateUser({ password: newPass });

      btn.disabled = false;
      btn.textContent = 'Simpan Kata Sandi';

      if (error) {
        errorEl.textContent = 'Gagal mengubah kata sandi. Pastikan kata sandi baru minimal 8 karakter.';
        errorEl.style.display = 'block';
        return;
      }

      document.getElementById('current-password').value = '';
      document.getElementById('new-password').value = '';
      document.getElementById('confirm-password').value = '';
      successEl.textContent = 'Kata sandi berhasil diubah.';
      successEl.style.display = 'block';
    }
  </script>
</body>
</html>
