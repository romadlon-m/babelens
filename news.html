<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Babelens - Pencarian Berita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js?v=20260907"></script>
  <link rel="stylesheet" href="style.css?v=20260907b">
</head>
<body class="news-page" style="visibility:hidden">

  <!-- GLOBAL HEADER -->
  <header class="app-header">
    <div class="app-header-left">
      <button id="mobileMenuBtn" class="mobile-menu-btn">☰</button>
      <img src="assets/images/babelens-logo.png" alt="Babelens" class="app-header-logo">
      <div class="app-header-tagline"><span>Lensa Berita</span><span>Bangka Belitung</span></div>
    </div>
    <div id="nav-placeholder" class="app-header-nav"></div>
    <div id="header-user-widget"></div>
  </header>

  <div class="app-body">

    <!-- MOBILE OVERLAY -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">

      <div id="sidebar-container"></div>

      <!-- KATA KUNCI + SCOPE CHIPS -->
      <div class="filter-group">
        <label>Kata Kunci
          <span class="tooltip tooltip-down tooltip-left info-icon" data-tooltip="Ketik lebih dari satu kata dan semuanya akan dicari sekaligus. Mau cari frasa yang persis sama? Pakai tanda kutip, contoh: &quot;harga telur&quot;">i</span>
        </label>
        <div class="keyword-search-box">
          <input id="keyword" type="text" enterkeyhint="search" placeholder="Cari kata kunci... (tekan Enter)">
          <button type="button" id="keyword_clear" class="keyword-clear-btn" title="Hapus kata kunci" aria-label="Hapus kata kunci">&times;</button>
          <button type="button" id="keyword_search_btn" class="keyword-search-btn" title="Cari" aria-label="Cari">🔍</button>
        </div>
        <div class="scope-chips">
          <button type="button" class="scope-chip active" data-cb="f_title"   onclick="toggleScope('f_title', this)">Judul</button>
          <button type="button" class="scope-chip active" data-cb="f_summary" onclick="toggleScope('f_summary', this)">Ringkasan</button>
          <button type="button" class="scope-chip"        data-cb="f_full"    onclick="toggleScope('f_full', this)">Artikel Lengkap</button>
        </div>
        <button type="button" id="quick-keyword-toggle" class="quick-keyword-toggle">
          Saran kata kunci <span class="quick-keyword-toggle-arrow">▾</span>
        </button>
        <div id="quick-keyword-chips" class="scope-chips"></div>
        <!-- Hidden checkboxes — dipakai JS, disinkron oleh chip -->
        <input type="checkbox" id="f_title"   checked style="display:none">
        <input type="checkbox" id="f_summary" checked style="display:none">
        <input type="checkbox" id="f_full"          style="display:none">
      </div>

      <div class="filter-divider"></div>

      <!-- PILIH PERIODE -->
      <div class="filter-group">
        <label>Pilih Periode</label>
        <select id="news_preset">
          <option value="">— Pilih Periode —</option>
          <optgroup label="Umum">
            <option value="30d" selected>30 Hari Terakhir</option>
            <option value="year">Tahun Ini</option>
          </optgroup>
          <optgroup label="Triwulan" id="news-preset-group-tw"></optgroup>
          <optgroup label="Bulanan"  id="news-preset-group-bln"></optgroup>
        </select>
      </div>

      <!-- TANGGAL -->
      <div class="filter-row">
        <div class="filter-group">
          <label>Tanggal Awal</label>
          <input type="date" id="date_from">
        </div>
        <div class="filter-group">
          <label>Tanggal Akhir</label>
          <input type="date" id="date_to">
        </div>
      </div>

      <div class="filter-divider"></div>

      <div class="filter-group">
        <label>Wilayah</label>
        <select id="region">
          <option value="">Semua Wilayah</option>
          <option>Bangka Belitung</option>
          <option>Bangka</option>
          <option>Belitung</option>
          <option>Bangka Barat</option>
          <option>Bangka Tengah</option>
          <option>Bangka Selatan</option>
          <option>Belitung Timur</option>
          <option>Kota Pangkal Pinang</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Lapangan Usaha</label>
        <select id="lapus">
          <option value="">Semua Lapangan Usaha</option>
          <option value="A">A - Pertanian, Kehutanan, dan Perikanan</option>
          <option value="B">B - Pertambangan dan Penggalian</option>
          <option value="C">C - Industri Pengolahan</option>
          <option value="D">D - Pengadaan Listrik dan Gas</option>
          <option value="E">E - Pengadaan Air, Pengelolaan Sampah, Limbah dan Daur Ulang</option>
          <option value="F">F - Konstruksi</option>
          <option value="G">G - Perdagangan Besar dan Eceran; Reparasi Mobil dan Sepeda Motor</option>
          <option value="H">H - Transportasi dan Pergudangan</option>
          <option value="I">I - Penyediaan Akomodasi dan Makan Minum</option>
          <option value="J">J - Informasi dan Komunikasi</option>
          <option value="K">K - Jasa Keuangan dan Asuransi</option>
          <option value="L">L - Real Estat</option>
          <!-- IMPORTANT: value must be "MN" (no comma) — must match the lapus column in Supabase DB. Do NOT change to "M,N". -->
          <option value="MN">M,N - Jasa Perusahaan</option>
          <option value="O">O - Administrasi Pemerintahan, Pertahanan dan Jaminan Sosial Wajib</option>
          <option value="P">P - Jasa Pendidikan</option>
          <option value="Q">Q - Jasa Kesehatan dan Kegiatan Sosial</option>
          <!-- IMPORTANT: value must be "RSTU" (no commas) — must match the lapus column in Supabase DB. Do NOT change to "R,S,T,U". -->
          <option value="RSTU">R,S,T,U - Jasa lainnya</option>
        </select>
      </div>

      <div class="filter-group">
        <label id="pengeluaran_filter_label">Komponen Pengeluaran</label>
        <select id="pengeluaran_filter">
          <option value="">Semua Komponen</option>
          <optgroup label="Subkomponen PKRT">
            <option value="1a">1a - Makanan dan Minuman Non Alkohol</option>
            <option value="1b">1b - Minuman Beralkohol dan Rokok</option>
            <option value="1c">1c - Pakaian</option>
            <option value="1d">1d - Perumahan, Air, Listrik, Energi</option>
            <option value="1e">1e - Perabot dan Perlengkapan RT</option>
            <option value="1f">1f - Kesehatan</option>
            <option value="1g">1g - Transportasi</option>
            <option value="1h">1h - Komunikasi</option>
            <option value="1i">1i - Rekreasi dan Budaya</option>
            <option value="1j">1j - Pendidikan</option>
            <option value="1k">1k - Hotel dan Penginapan</option>
            <option value="1l">1l - Barang Pribadi dan Jasa Lainnya</option>
          </optgroup>
          <optgroup label="Komponen Utama">
            <option value="1">1 - Pengeluaran Konsumsi RT</option>
            <option value="2">2 - Pengeluaran Konsumsi LNPRT</option>
            <option value="3">3 - Pengeluaran Konsumsi Pemerintah</option>
            <option value="4">4 - Pembentukan Modal Tetap Bruto</option>
            <option value="5">5 - Perubahan Inventori</option>
            <option value="6">6 - Ekspor Luar Negeri</option>
            <option value="7">7 - Impor Luar Negeri</option>
          </optgroup>
        </select>
      </div>

      <div class="filter-divider"></div>

      <div class="filter-group">
        <label>Status Kejadian</label>
        <label class="checkbox-row">
          <input class="event_filter" type="checkbox" value="Sudah Terjadi" checked>
          <span>Sudah Terjadi</span>
        </label>
        <label class="checkbox-row">
          <input class="event_filter" type="checkbox" value="Sedang Terjadi" checked>
          <span>Sedang Terjadi</span>
        </label>
        <label class="checkbox-row">
          <input class="event_filter" type="checkbox" value="Akan Terjadi" checked>
          <span>Akan Terjadi</span>
        </label>
      </div>

      <div class="filter-divider"></div>

      <!-- INDIKATOR FILTER AKTIF -->
      <div id="active-filters" class="active-filters" style="display:none;">
        <small>Filter aktif:</small>
        <div id="active-filters-list"></div>
      </div>

      <div class="sidebar-actions">
        <button class="secondary-btn" onclick="resetSearch()">Reset</button>
      </div>

    </aside>

    <!-- MAIN -->
    <main class="main-content">

      <!-- TOPBAR -->
      <header class="topbar">
        <div class="topbar-row">
          <div class="topbar-left">
            <div><h2>Pencarian Berita</h2></div>
            <label class="pdrb-toggle-label">
              <input type="checkbox" id="pdrb_only">
              <span class="pdrb-toggle-track">
                <span class="pdrb-toggle-thumb"></span>
              </span>
              <span class="pdrb-toggle-text">Hanya PDRB Relevan</span>
              <span class="tooltip tooltip-down info-icon" data-tooltip="Label dibuat otomatis oleh AI. Relevansi mencakup keterkaitan langsung maupun tidak langsung dengan PDRB — gunakan sebagai panduan awal, bukan keputusan final.">i</span>
            </label>
          </div>
          <div class="meta-bar">
            <div id="meta"></div>
            <div class="page-size">
              <label for="sort_select">Urutkan</label>
              <select id="sort_select">
                <option value="desc">Terbaru</option>
                <option value="asc">Terlama</option>
              </select>
            </div>
            <div class="page-size">
              <label for="page_size_select">Jumlah Berita per Halaman</label>
              <select id="page_size_select">
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="250">250</option>
              </select>
            </div>
            <button
              class="export-btn"
              onclick="exportToExcel()"
              title="Unduh hasil pencarian dalam format Excel"
            >
              Unduh Excel
            </button>
          </div>
        </div>
        <div id="pdrb-notice"></div>
      </header>

      <!-- RESULTS -->
      <section id="result" class="cards-container"></section>

      <!-- PAGINATION -->
      <section id="pager" class="pager fixed-bottom"></section>

    </main>

  </div><!-- /.app-body -->

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="sidebar.js?v=20260907"></script>
  <script>
    requireAuth().then(r => { if (r) document.body.style.visibility = 'visible'; });
  </script>
  <script src="news-search.js?v=20260912b"></script>

  <!-- FEEDBACK BUTTON -->
  <div id="feedback-wrapper">
    <span id="feedback-label">Beri masukan</span>
    <button id="feedback-btn" onclick="openFeedback()"
      title="Beri masukan untuk membantu kami meningkatkan Babelens">💬</button>
  </div>

  <!-- FEEDBACK MODAL -->
  <div id="feedback-overlay" onclick="closeFeedback(event)">
    <div class="feedback-modal">
      <div class="feedback-modal-header">
        <span>Beri Masukan</span>
        <button onclick="closeFeedback(null, true)">✕</button>
      </div>
      <div class="feedback-stars" id="feedback-stars">
        <span data-value="1">★</span>
        <span data-value="2">★</span>
        <span data-value="3">★</span>
        <span data-value="4">★</span>
        <span data-value="5">★</span>
      </div>
      <textarea id="feedback-message" placeholder="Contoh: hasil pencarian kurang relevan, label PDRB tidak akurat, dll." rows="4"></textarea>
      <button id="feedback-submit" onclick="submitFeedback()">Kirim</button>
      <div id="feedback-status"></div>
    </div>
  </div>
</body>
</html>
