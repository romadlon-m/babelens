<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Babelens - Review Label</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js?v=20260919"></script>
  <link rel="stylesheet" href="style.css?v=20260924e">
</head>
<body class="admin-page admin-review-page" style="visibility:hidden;">

  <!-- GLOBAL HEADER -->
  <header class="app-header">
    <div class="app-header-left">
      <img src="assets/images/babelens-logo.png" alt="Babelens" class="app-header-logo">
      <div class="app-header-tagline"><span>Lensa Berita</span><span>Bangka Belitung</span></div>
    </div>
    <div id="nav-placeholder" class="app-header-nav"></div>
    <div id="header-user-widget"></div>
  </header>

  <div class="app-body">
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-row">
          <div class="topbar-left">
            <div><h2>Review Label</h2></div>
          </div>
          <a class="card-btn" href="admin-users.html">← Kembali ke Kelola Pengguna</a>
        </div>
      </header>

      <div class="review-toolbar">
        <div class="review-filters">
          <div class="filter-group">
            <label for="review-batch">Batch</label>
            <select id="review-batch">
              <option value="batch1" selected>Batch 1 (Baru)</option>
              <option value="batch2">Batch 2 (Data Lama)</option>
              <option value="">Semua Batch</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="review-completeness">Kelengkapan</label>
            <select id="review-completeness">
              <option value="" selected>Semua</option>
              <option value="lengkap">Lengkap (3/3)</option>
              <option value="sebagian">Sebagian</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="review-kondisi-label">Kondisi Label</label>
            <select id="review-kondisi-label">
              <option value="lolos_tidak" selected>Lolos, tapi Lapus &amp; Pengeluaran Tidak</option>
              <option value="lolos_ya">Lolos, Lapus dan/atau Pengeluaran Ya</option>
              <option value="tidak_lolos">Tidak Lolos</option>
              <option value="">Semua</option>
            </select>
          </div>
        </div>
        <div id="review-remaining" class="review-remaining">Memuat...</div>
      </div>

      <div id="review-loading" class="review-loading" hidden>Memuat batch...</div>

      <div id="review-list" class="review-list"></div>

      <div id="review-empty" class="labeling-empty-state" hidden>
        🎉 Tidak ada baris di antrean ini.
      </div>
    </main>
  </div><!-- /.app-body -->

  <script src="sidebar.js?v=20260919"></script>
  <script src="labeling-common.js?v=20260920c"></script>
  <script src="labeling-screener.js?v=20260913b"></script>
  <script src="labeling-lapus.js?v=20260920a"></script>
  <script src="labeling-pengeluaran.js?v=20260920a"></script>
  <script src="admin-review.js?v=20260922a"></script>
  <script>
    requireAuth().then(r => {
      if (!r) return;
      if (!r.profile?.is_admin) {
        window.location.replace('index.html');
        return;
      }
      document.body.style.visibility = 'visible';
      initReviewPage();
    });
  </script>
</body>
</html>
